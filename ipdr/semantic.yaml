  - question: Compare WhatsApp, TikTok and Facebook users across Karachi, Lahore and Islamabad (5 November)
    notes: Two categories and one measure, so the result suits a grouped bar or a heatmap.
    sql: |
      SELECT replaceOne(client_location, ' Pakistan', '') AS city,
             multiIf(app_label LIKE 'TikTok%', 'TikTok', app_label = 'WhatsAPP', 'WhatsApp', 'Facebook') AS app,
             uniqExactIf(subscriber_id, position(subscriber_id, '_') = 0) AS users
      FROM wms_dist.ntc_ssl_log
      WHERE start_time >= toUnixTimestamp('2026-11-05 00:00:00', 'Asia/Karachi')
