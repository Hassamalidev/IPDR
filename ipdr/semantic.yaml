  - question: How long do people spend on YouTube per day in Lahore
    notes: Time spent = sum(duration) (milliseconds) per subscriber, then averaged over subscribers and days.
    sql: |
      SELECT toDate(toDateTime(start_time, 'Asia/Karachi')) AS day,
             round(sum(duration) / 3.6e6 / uniqExactIf(subscriber_id, position(subscriber_id, '_') = 0), 2) AS hours_per_user,
             uniqExactIf(subscriber_id, position(subscriber_id, '_') = 0) AS users
      FROM wms_dist.ntc_ssl_log
      WHERE start_time >= toUnixTimestamp('2026-11-03 00:00:00', 'Asia/Karachi')
        AND start_time <  toUnixTimestamp('2026-11-10 00:00:00', 'Asia/Karachi')
        AND client_location = 'Lahore Pakistan'
        AND app_label IN ('Youtube_QUIC_Video', 'Youtube_SSL_Video', 'Youtube_NonHTTP_Video', 'Youtube_Others', 'Youtube_Upload', 'YouTubeMusic')
        AND position(subscriber_id, '_') = 0
      GROUP BY day
      ORDER BY day

  - question: Compare this week with the week before for WhatsApp, by connections and volume
    notes: Two periods side by side with countIf/sumIf on the period, one row per measure.
    sql: |
      SELECT countIf(start_time >= toUnixTimestamp('2026-11-03 00:00:00', 'Asia/Karachi')) AS connections_this_week,
             countIf(start_time <  toUnixTimestamp('2026-11-03 00:00:00', 'Asia/Karachi')) AS connections_previous_week,
