    notes: Upload = c2s_byte_num (from the subscriber). A list of people.
    sql: |
      SELECT subscriber_id,
             round(sum(c2s_byte_num) / 1e6, 2) AS upload_mb,
             round(sum(s2c_byte_num) / 1e6, 2) AS download_mb,
             count() AS connections
      FROM wms_dist.ntc_ssl_log
