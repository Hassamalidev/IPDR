  - question: Which handsets (IMEI) are used by more than one subscriber
    notes: Shared devices or SIM swaps. imei is only on mobile numbers and sometimes empty, so imei != ''.
    sql: |
      SELECT imei,
             uniq(subscriber_id) AS subscribers,
             groupUniqArray(5)(subscriber_id) AS example_subscribers,
             count() AS connections
      FROM wms_dist.ntc_ssl_log
      WHERE start_time >= toUnixTimestamp('2026-11-03 00:00:00', 'Asia/Karachi')
        AND start_time <  toUnixTimestamp('2026-11-10 00:00:00', 'Asia/Karachi')
        AND imei != ''
      GROUP BY imei
      HAVING subscribers > 1
      ORDER BY subscribers DESC, connections DESC
      LIMIT 50

  - question: Users who used both TikTok and VPN apps last week
    notes: Two conditions on the same person, so group by subscriber and keep those with both (countIf > 0 for each). VPN is the vpn_proxy concept, every label.
    sql: |
      SELECT subscriber_id,
             countIf(app_label LIKE 'TikTok%') AS tiktok_connections,
             countIf(app_label IN ('NordVPN', 'SurfsharkVPN', 'ZenmateVPN', 'PrivateVPN', 'WindscribeVPN', 'ProtonVPN', 'HolaVPN', 'ExpressVPN', 'VPNSuperUnlimitedProxy', 'Cloudflare_Warp', 'SuperVPN', 'TurboVPN', 'TouchVPN', 'CyberGhost', 'VyprVPN', 'VpnMaster', 'AnchorFree', 'HotSpot', 'AlohaMobile', 'iCloudPrivateRelay', 'OperaMini_Socks')) AS vpn_connections
      FROM wms_dist.ntc_ssl_log
      WHERE start_time >= toUnixTimestamp('2026-11-03 00:00:00', 'Asia/Karachi')
        AND start_time <  toUnixTimestamp('2026-11-10 00:00:00', 'Asia/Karachi')
        AND position(subscriber_id, '_') = 0
        AND (app_label LIKE 'TikTok%' OR app_label IN ('NordVPN', 'SurfsharkVPN', 'ZenmateVPN', 'PrivateVPN', 'WindscribeVPN', 'ProtonVPN', 'HolaVPN', 'ExpressVPN', 'VPNSuperUnlimitedProxy', 'Cloudflare_Warp', 'SuperVPN', 'TurboVPN', 'TouchVPN', 'CyberGhost', 'VyprVPN', 'VpnMaster', 'AnchorFree', 'HotSpot', 'AlohaMobile', 'iCloudPrivateRelay', 'OperaMini_Socks'))
      GROUP BY subscriber_id
      HAVING tiktok_connections > 0 AND vpn_connections > 0
      ORDER BY vpn_connections DESC
      LIMIT 50

  - question: Share of each ISP in Karachi's data volume last week
    notes: A share of a total uses a window over the rows; volume can be shared out, users cannot.
    sql: |
      SELECT client_asn AS isp,
             round(sum(c2s_byte_num + s2c_byte_num) / 1e9, 2) AS volume_gb,
             round(100 * sum(c2s_byte_num + s2c_byte_num) / sum(sum(c2s_byte_num + s2c_byte_num)) OVER (), 1) AS share_pct
      FROM wms_dist.ntc_ssl_log
      WHERE start_time >= toUnixTimestamp('2026-11-03 00:00:00', 'Asia/Karachi')
        AND start_time <  toUnixTimestamp('2026-11-10 00:00:00', 'Asia/Karachi')
        AND client_location = 'Karachi Pakistan'
        AND client_asn != ''
      GROUP BY isp
      ORDER BY sum(c2s_byte_num + s2c_byte_num) DESC
      LIMIT 20

