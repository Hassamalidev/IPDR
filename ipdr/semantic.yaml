             round(sumIf(c2s_byte_num + s2c_byte_num, start_time <  toUnixTimestamp('2026-11-03 00:00:00', 'Asia/Karachi')) / 1e9, 2) AS volume_gb_previous_week
      FROM wms_dist.ntc_ssl_log
      WHERE start_time >= toUnixTimestamp('2026-10-27 00:00:00', 'Asia/Karachi')
        AND start_time <  toUnixTimestamp('2026-11-10 00:00:00', 'Asia/Karachi')
        AND app_label IN ('WhatsAPP', 'WhatsAPP_Web', 'WhatsApp_Login', 'WhatsApp_VoIP')

