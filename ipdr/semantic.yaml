  - question: Which mobile subscribers changed handset (more than one IMEI) last week
    notes: Per subscriber, distinct non-empty IMEIs. Mobile numbers only carry imei.
    sql: |
      SELECT subscriber_id,
             uniqExactIf(imei, imei != '') AS handsets,
             groupUniqArrayIf(5)(imei, imei != '') AS imeis
      FROM wms_dist.ntc_ssl_log
      WHERE start_time >= toUnixTimestamp('2026-11-03 00:00:00', 'Asia/Karachi')
