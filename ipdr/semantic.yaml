  - question: Show the address and ISP of subscriber 923869624946
    notes: Stored details of one subscriber. loc is the address (house or serving cell site), client_asn the ISP. Every stored value is listed, because a few IDs carry two addresses or ISPs. Follow-ups such as "address of this user" use the subscriber_id from the earlier answer.
    sql: |
      SELECT subscriber_id,
             arrayStringConcat(arraySort(groupUniqArrayIf(loc, loc != '')), ' | ') AS address,
             arrayStringConcat(arraySort(groupUniqArrayIf(client_asn, client_asn != '')), ' | ') AS isp,
             arrayStringConcat(arraySort(groupUniqArrayIf(client_location, client_location != '')), ' | ') AS city,
             arrayStringConcat(arraySort(groupUniqArrayIf(geo, geo != '')), ' | ') AS geo
      FROM wms_dist.ntc_ssl_log
      WHERE start_time >= toUnixTimestamp('2026-11-03 00:00:00', 'Asia/Karachi')
        AND start_time <  toUnixTimestamp('2026-11-10 00:00:00', 'Asia/Karachi')
        AND subscriber_id IN ('923869624946')
      GROUP BY subscriber_id

